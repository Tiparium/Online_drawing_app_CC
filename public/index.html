<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ============================
         MAIN MENU SCREEN
    ============================= -->
    <div id="mainMenu" class="screen active">
        <div class="menu-container">

            <header class="menu-header">
                <h1>Drawing Board</h1>
                <p>Select a whiteboard to join or create a new one</p>
            </header>

            <!-- Header bar containing title + Create button -->
            <div class="whiteboard-list-header">
                <h2>Available Whiteboards</h2>
                <button id="createWhiteboardBtn" class="create-btn">+ Create</button>
            </div>

            <!-- Scrollable list container -->
            <div class="whiteboard-list-container">
                <div id="whiteboardList"></div>
            </div>

        </div>
    </div>


    <!-- ============================
         CREATE WHITEBOARD MODAL
    ============================= -->
    <div id="createModal" class="modal hidden">
        <div class="modal-backdrop"></div>

        <div class="modal-content">

            <h3>Create New Whiteboard</h3>

            <div class="modal-body">
                <div class="form-group">
                    <label for="whiteboardName">Whiteboard Name:</label>
                    <input type="text" id="whiteboardName" placeholder="Enter whiteboard name" maxlength="50">
                </div>

                <div class="form-group">
                    <label>Privacy:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="privacy" value="public" checked>
                            <span>Public</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="privacy" value="private">
                            <span>Private</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="cancelCreateBtn" class="cancel-btn">Cancel</button>
                <button id="confirmCreateBtn" class="confirm-btn">Create & Join</button>
            </div>

        </div>
    </div>


    <!-- ============================
         DRAWING SCREEN
    ============================= -->
    <div id="drawingScreen" class="screen">

        <div class="container">

            <header>
                <div class="drawing-header-left">
                    <button id="backToMenuBtn" class="back-btn">← Back to Whiteboards</button>
                    <h1>Drawing Board</h1>
                </div>

                <div class="toolbar">
                    <button id="drawBtn" class="tool-btn active">Draw</button>
                    <button id="selectBtn" class="tool-btn">Select</button>
                    <button id="rectBtn" class="tool-btn">Rectangle</button>
                    <button id="circleBtn" class="tool-btn">Circle</button>
                    <button id="textBtn" class="tool-btn">Text</button>
                    <button id="clearBtn" class="tool-btn danger">Clear</button>

                    <input type="color" id="colorPicker" value="#000000">

                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="brushSizeValue">5</span>

                    <input type="range" id="smoothingSlider" min="0" max="100" value="0">
                    <span>Smoothing: <span id="smoothingValue">0</span></span>
                </div>
            </header>

            <main>
                <canvas id="canvas"></canvas>

                <!-- USERS PANE -->
                <div id="usersPane" class="users-pane">
                    <div class="users-pane-header">
                        <h3>Users</h3>
                        <button id="toggleUsersPane" class="toggle-btn">−</button>
                    </div>
                    <div id="usersList" class="users-list"></div>
                </div>
            </main>

            <footer>
                <button id="saveBtn" class="action-btn">Save as Image</button>
                <button id="loadBtn" class="action-btn">Load Image</button>
                <button id="debugBtn" class="action-btn">DEBUG_FEATURES</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">

                <div id="debugPanel" class="debug-panel" style="display:none;"></div>
            </footer>

        </div>
    </div>


    <!-- ============================
         SCRIPT INCLUDES
    ============================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
