<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Drawing Board</h1>
            <div class="toolbar">
                <button id="drawBtn" class="tool-btn active">Draw</button>
                <button id="selectBtn" class="tool-btn">Select</button>
                <button id="rectBtn" class="tool-btn">Rectangle</button>
                <button id="circleBtn" class="tool-btn">Circle</button>
                <button id="textBtn" class="tool-btn">Text</button>
                <button id="clearBtn" class="tool-btn danger">Clear</button>
                <input type="color" id="colorPicker" value="#000000" title="Color">
                <input type="range" id="brushSize" min="1" max="50" value="5" title="Brush Size">
                <span id="brushSizeValue">5</span>
                <input type="range" id="smoothingSlider" min="0" max="100" value="0" title="Smoothing">
                <span>Smoothing: <span id="smoothingValue">0</span></span>
            </div>
        </header>
        
        <main>
            <canvas id="canvas"></canvas>
        </main>
        
        <footer>
            <button id="saveBtn" class="action-btn">Save as Image</button>
            <button id="loadBtn" class="action-btn">Load Image</button>
            <button id="debugBtn" class="action-btn">DEBUG_FEATURES</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            
            <div id="debugPanel" class="debug-panel" style="display: none;">
                <h3>Debug Features</h3>
                <div class="debug-section">
                    <button id="addSimUserBtn" class="debug-btn">Add Simulated User</button>
                    <button id="removeSimUserBtn" class="debug-btn">Remove Simulated User</button>
                </div>
                <div class="debug-section">
                    <label>Simulation Speed: <span id="simSpeedValue">5</span></label>
                    <input type="range" id="simSpeedSlider" min="1" max="10" value="5">
                </div>
                <div class="debug-section">
                    <label>Drawing Frequency: <span id="drawFreqValue">0.3</span></label>
                    <input type="range" id="drawFreqSlider" min="0.1" max="1" step="0.1" value="0.3">
                </div>
                <div class="debug-section">
                    <label>Settings Change Frequency: <span id="settingsFreqValue">0.05</span></label>
                    <input type="range" id="settingsFreqSlider" min="0.01" max="0.2" step="0.01" value="0.05">
                </div>
                <div id="simUserCount" class="debug-info">Simulated Users: 0</div>
            </div>
        </footer>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
